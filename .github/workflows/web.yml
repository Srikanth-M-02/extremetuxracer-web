name: Build web version

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EMSDK_VERSION: 6.0.13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        run: |
          EMSDK="$RUNNER_TEMP/emsdk"
          if [ ! -d "$EMSDK" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          fi
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"

      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j "$(nproc)"

      - name: Collect site
        run: |
          mkdir site
          cp build-web/web/index.html build-web/web/etr.js build-web/web/etr.wasm build-web/web/etr.data site/
          ls -la site

      - name: Upload site
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
